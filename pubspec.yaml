name: null_notes
description: "Null — Minimalist Notes Application"
publish_to: 'none'
version: 1.0.4+5

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  image_picker: ^1.2.3
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/ecosystem/21days/

  fonts:
    # --- Apple SF Pro Family ---
    - family: SFProDisplay
      fonts:
        - asset: assets/fonts/03_proprietary_restricted/sf-pro-display/SFPRODISPLAYREGULAR.OTF
          weight: 400
        - asset: assets/fonts/03_proprietary_restricted/sf-pro-display/SFPRODISPLAYMEDIUM.OTF
          weight: 500
        - asset: assets/fonts/03_proprietary_restricted/sf-pro-display/SFPRODISPLAYBOLD.OTF
          weight: 700
        - asset: assets/fonts/03_proprietary_restricted/sf-pro-display/SFPRODISPLAYBLACKITALIC.OTF
          weight: 900
          style: italic
        - asset: assets/fonts/03_proprietary_restricted/sf-pro-display/SFPRODISPLAYLIGHTITALIC.OTF
          weight: 300
          style: italic

    - family: SFProText
      fonts:
        - asset: assets/fonts/03_proprietary_restricted/Apple-SF-Pro/San-Francisco-Pro-Fonts-master/SF-Pro-Text-Regular.otf
          weight: 400
        - asset: assets/fonts/03_proprietary_restricted/Apple-SF-Pro/San-Francisco-Pro-Fonts-master/SF-Pro-Text-Medium.otf
          weight: 500
        - asset: assets/fonts/03_proprietary_restricted/Apple-SF-Pro/San-Francisco-Pro-Fonts-master/SF-Pro-Text-Bold.otf
          weight: 700

    - family: SFProRounded
      fonts:
        - asset: assets/fonts/03_proprietary_restricted/Apple-SF-Pro/San-Francisco-Pro-Fonts-master/SF-Pro-Rounded-Regular.otf
          weight: 400
        - asset: assets/fonts/03_proprietary_restricted/Apple-SF-Pro/San-Francisco-Pro-Fonts-master/SF-Pro-Rounded-Medium.otf
          weight: 500
        - asset: assets/fonts/03_proprietary_restricted/Apple-SF-Pro/San-Francisco-Pro-Fonts-master/SF-Pro-Rounded-Bold.otf
          weight: 700

    # --- Curated Editorial & Display Fonts ---
    - family: Beatrice
      fonts:
        - asset: assets/fonts/02_trial_personal_use/editorial_trials/Beatrice-Trial/BeatriceDeckTRIAL-Regular-BF64829e9182459.ttf
          weight: 400
        - asset: assets/fonts/02_trial_personal_use/editorial_trials/Beatrice-Trial/BeatriceDeckTRIAL-Bold-BF64829e916f5e9.ttf
          weight: 700
        - asset: assets/fonts/02_trial_personal_use/editorial_trials/Beatrice-Trial/BeatriceDeckTRIAL-BoldItalic-BF64829e918c7cd.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/02_trial_personal_use/editorial_trials/Beatrice-Trial/BeatriceDeckTRIAL-Light-BF64829e9192d32.ttf
          weight: 300

    - family: Kaftan
      fonts:
        - asset: assets/fonts/02_trial_personal_use/editorial_trials/kaftan-trial.otf
          weight: 400

    - family: BasementGrotesque
      fonts:
        - asset: assets/fonts/03_proprietary_restricted/BasementGrotesque/BasementGrotesque-Black_v1.202.otf
          weight: 900

    - family: Coolvetica
      fonts:
        - asset: assets/fonts/03_proprietary_restricted/coolvetica/Coolvetica Rg.otf
          weight: 400
        - asset: assets/fonts/03_proprietary_restricted/coolvetica/Coolvetica Rg It.otf
          weight: 400
          style: italic
        - asset: assets/fonts/03_proprietary_restricted/coolvetica/Coolvetica Hv Comp.otf
          weight: 800

    - family: Futura
      fonts:
        - asset: assets/fonts/03_proprietary_restricted/futura/Futura Book font.ttf
          weight: 400
        - asset: assets/fonts/03_proprietary_restricted/futura/futura medium bt.ttf
          weight: 500
        - asset: assets/fonts/03_proprietary_restricted/futura/Futura Bold font.ttf
          weight: 700
        - asset: assets/fonts/03_proprietary_restricted/futura/Futura Bold Italic font.ttf
          weight: 700
          style: italic

    - family: Aloevera
      fonts:
        - asset: assets/fonts/02_trial_personal_use/creative_packs/aloevera-font/Aloevera-OVoWO.ttf
          weight: 400

    - family: Inter
      fonts:
        - asset: assets/fonts/01_open_source_commercial_safe/Inter/inter-black/inter-black.ttf
          weight: 900

    - family: EuropaNova
      fonts:
        - asset: assets/fonts/03_proprietary_restricted/Europa nova/EuropaNuovaRegular.ttf
          weight: 400
        - asset: assets/fonts/03_proprietary_restricted/Europa nova/EuropaNuovaBold.ttf
          weight: 700
        - asset: assets/fonts/03_proprietary_restricted/Europa nova/EuropaNuovaItalic.ttf
          weight: 400
          style: italic

    - family: Gotham
      fonts:
        - asset: assets/fonts/03_proprietary_restricted/Gotham-Font/GothamBook.ttf
          weight: 400
        - asset: assets/fonts/03_proprietary_restricted/Gotham-Font/GothamMedium.ttf
          weight: 500
        - asset: assets/fonts/03_proprietary_restricted/Gotham-Font/GothamBold.ttf
          weight: 700
        - asset: assets/fonts/03_proprietary_restricted/Gotham-Font/GothamBoldItalic.ttf
          weight: 700
          style: italic

    - family: Agitha
      fonts:
        - asset: assets/fonts/02_trial_personal_use/creative_packs/agitha-font/Agitha-4no8p.ttf
          weight: 400
        - asset: assets/fonts/02_trial_personal_use/creative_packs/agitha-font/Agitha-ov52d.otf
          weight: 400

    - family: ForeverFreedom
      fonts:
        - asset: assets/fonts/03_proprietary_restricted/Forever Freedom Font Family/Forever Freedom Regular.ttf
          weight: 400
        - asset: assets/fonts/03_proprietary_restricted/Forever Freedom Font Family/Forever Freedom Italic.ttf
          weight: 400
          style: italic

    - family: TimesNewRoman
      fonts:
        - asset: assets/fonts/03_proprietary_restricted/Times New Romens/Times New Roman.ttf
          weight: 400
        - asset: assets/fonts/03_proprietary_restricted/Times New Romens/Times New Roman Bold.ttf
          weight: 700
        - asset: assets/fonts/03_proprietary_restricted/Times New Romens/Times New Roman Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/03_proprietary_restricted/Times New Romens/Times New Roman Bold Italic.ttf
          weight: 700
          style: italic
